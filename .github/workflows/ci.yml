name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The Windows and Linux adapters are written on a Mac, so this is where
      # they are actually compiled against their own platform. A type error in
      # one of them fails here rather than on a user's machine.
      - name: Build
        run: cargo build --workspace --exclude deskio
      - name: Test
        run: cargo test --workspace --exclude deskio
      - name: Clippy
        run: cargo clippy --workspace --exclude deskio -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check

  interface:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Type check
        run: npx tsc --noEmit
        working-directory: app
      - name: Build
        run: npm run build
        working-directory: app
