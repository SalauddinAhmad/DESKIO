name: Release

# Builds the installers for a tag and attaches them to its release, so the
# in-app updater has something to find. Every release must keep an asset for
# each platform and a vX.Y.Z tag — the updater matches on both.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Creating the release and attaching installers to it needs write access to
# repository contents; the default token is read-only.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple silicon)
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            name: macOS (Intel)
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            name: Windows
            target: ""
            args: ""
          - os: ubuntu-latest
            name: Linux
            target: ""
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The Intel build runs on an Apple-silicon runner, so its target has
          # to be installed explicitly.
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      - run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: BHUninstaller ${{ github.ref_name }}
          releaseDraft: true
          # Without this the Linux job reports "No artifacts were found": the
          # default glob does not match every bundle tauri produces there.
          includeUpdaterJson: false
          args: ${{ matrix.args }}
