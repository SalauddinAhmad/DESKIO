name: Release

# Builds the installers for a tag and attaches them to its release, so the
# in-app updater has something to find. Every release must keep an asset for
# each platform and a vX.Y.Z tag — the updater matches on both.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple silicon)
            args: --target aarch64-apple-darwin
          - os: macos-latest
            name: macOS (Intel)
            args: --target x86_64-apple-darwin
          - os: windows-latest
            name: Windows
            args: ""
          - os: ubuntu-latest
            name: Linux
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: BHUninstaller ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
