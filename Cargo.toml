[workspace]
resolver = "2"
members = ["crates/dc-core", "crates/dc-cli", "app/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Deskio Team"]
repository = "https://github.com/SalauddinAhmad/DESKIO"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
thiserror = "2"
dirs = "6"
trash = "5"
